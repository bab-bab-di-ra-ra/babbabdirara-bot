name: 밥밥디라라

on:
  # 정시성 보장을 위해 GitHub schedule 대신 외부 스케줄러(cron-job.org)가
  # 평일 08:29 KST에 workflow_dispatch API를 호출해 실행한다.
  # (schedule 이벤트는 GitHub 큐 지연으로 수십 분~수 시간 밀릴 수 있음)
  workflow_dispatch: # 외부 트리거 & 수동 테스트 버튼

jobs:
  lunch-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4 openai

      - name: 밥밥디라라 실행 🍱
        run: |
          python scraper.py \
            "${{ secrets.TEAMS_WEBHOOK }}" \
            "${{ secrets.OPENAI_API_KEY }}" \
            "${{ secrets.IMGBB_KEY }}"
